<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Digipet Smart Car</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Arial', sans-serif; 
        }
        
        /* 彻底禁止所有选中 */
        body, button, div, span, .control-btn, .mode-btn {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        
        /* 禁止图片和 emoji 被选中 */
        img, svg, .emoji, button span, button::before, button::after {
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
        }
        
        body { 
            background: #f2f2f7; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .container { 
            width: 100%; 
            max-width: 380px; 
            background: #fff; 
            border-radius: 20px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            padding: 28px 22px; 
            text-align: center; 
            position: relative;
        }
        .title { 
            font-size: 24px; 
            margin-bottom: 10px; 
            color: #1c1c1e; 
            font-weight: 700; 
        }
        #status { 
            font-size: 15px; 
            font-weight: 600; 
            margin-bottom: 24px; 
        }
        .connect-btn { 
            width: 100%; 
            height: 54px; 
            border-radius: 14px; 
            border: none; 
            background: #007aff; 
            color: white; 
            font-size: 17px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-bottom: 20px; 
            transition: 0.2s;
        }
        .connect-btn:active { transform: scale(0.96); }

        /* 右上角设置按钮 */
        .settings-icon {
            position: absolute;
            top: 22px;
            right: 22px;
            width: 36px;
            height: 36px;
            background: #e5e5ea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            display: none;
        }

        /* 所有面板默认隐藏 */
        .mode-select, .control-panel, .pet-main-panel, 
        .nbm-active-panel, .setup-panel, .control-info { 
            display: none; 
            margin-top: 16px; 
        }

        /* 控制信息显示区域 */
        .control-info {
            background: #e8f0fe;
            padding: 12px;
            border-radius: 12px;
            color: #1c1c1e;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            word-break: break-word;
        }

        /* 按钮样式 */
        .mode-btn { 
            width: 100%; 
            height: 56px; 
            border-radius: 14px; 
            border: none; 
            background: #000; 
            color: white; 
            font-size: 17px; 
            font-weight: 600; 
            cursor: pointer; 
            margin: 9px 0; 
            transition: 0.2s; 
        }
        .mode-btn:active { transform: scale(0.96); }
        .back-btn { background: #8e8e93 !important; }
        .stop-btn { background: #ff3b30 !important; }

        /* 操控按钮布局 */
        .btn-grid { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 10px; 
            margin-top: 10px;
        }
        .row { display: flex; gap: 10px; }
        .control-btn { 
            width: 74px; 
            height: 74px; 
            border-radius: 16px; 
            border: none; 
            background: #1c1c1e; 
            color: white; 
            font-size: 28px; 
            font-weight: 600; 
            transition: 0.15s; 
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .control-btn.pressed { 
            background: #007aff !important; 
            transform: scale(0.93); 
        }

        /* 宠物面板 */
        .pet-main-panel, .nbm-active-panel { 
            background: #f9f9fb; 
            padding: 22px; 
            border-radius: 16px; 
            border: 1px solid #d1d1d6; 
        }
        .rssi-val { 
            font-size: 34px; 
            font-weight: 700; 
            color: #007aff; 
            margin: 12px 0; 
        }
        .status-text {
            font-size: 15px;
            color: #3a3a3c;
            margin: 10px 0;
            line-height: 1.4;
        }

        /* 设置面板 */
        .setup-panel {
            background: #f9f9fb;
            padding: 24px;
            border-radius: 16px;
            text-align: left;
        }
        .setup-title {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 18px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            font-size: 15px;
            font-weight: 600;
            color: #1c1c1e;
            display: block;
            margin-bottom: 8px;
        }
        .input-group input, .input-group select {
            width: 100%;
            height: 48px;
            border-radius: 10px;
            border: 1px solid #c7c7cc;
            padding: 0 12px;
            font-size: 16px;
        }
        .save-btn {
            width: 100%;
            height: 50px;
            border-radius: 12px;
            background: #007aff;
            color: white;
            font-size: 17px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .disconnect-btn {
            background: #ff3b30 !important;
            margin-top: 16px;
        }
        
        /* 防止任何拖拽选中 */
        button, div, span {
            -webkit-touch-callout: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 右上角设置 -->
        <div class="settings-icon" id="settingsBtn" onclick="showSetup()">⚙️</div>

        <h1 class="title">Digipet Car</h1>
        <div id="status" style="color: #ff3b30;">Disconnected</div>

        <button class="connect-btn" id="connectBtn" onclick="startBLE()">Connect BLE</button>

        <!-- 主菜单 -->
        <div class="mode-select" id="modeSelect">
            <button class="mode-btn" onclick="enterController()">🎮 Controller Mode</button>
            <button class="mode-btn" onclick="enterPetMain()">🐾 Pet Mode</button>
            <button class="mode-btn disconnect-btn" onclick="disconnectBLE()">🔌 Disconnect</button>
        </div>

        <!-- 手动控制 -->
        <div class="control-panel" id="controls">
            <div class="control-info" id="controlInfo">🎮 Ready to control</div>
            <div class="btn-grid">
                <div class="row">
                    <button class="control-btn" data-cmd="F">▲</button>
                </div>
                <div class="row">
                    <button class="control-btn" data-cmd="L">◀</button>
                    <button class="control-btn stop-btn" data-cmd="S">●</button>
                    <button class="control-btn" data-cmd="R">▶</button>
                </div>
                <div class="row">
                    <button class="control-btn" data-cmd="B">▼</button>
                </div>
                <div class="row">
                    <button class="control-btn" data-cmd="A">↺</button>
                    <button class="control-btn" data-cmd="C">↻</button>
                </div>
            </div>
            <button class="mode-btn back-btn" onclick="exitToMenu()">Back to Menu</button>
            <button class="mode-btn disconnect-btn" onclick="disconnectBLE()">Disconnect</button>
        </div>

        <!-- Pet Mode 二级菜单 -->
        <div class="pet-main-panel" id="petMainPanel">
            <button class="mode-btn" onclick="startNBM()">🌿 Natural Behaviour Mode</button>
            <button class="mode-btn" onclick="startSpotting()">👁 Spotting Mode</button>
            <button class="mode-btn back-btn" onclick="exitToMenu()">Back to Main Menu</button>
            <button class="mode-btn disconnect-btn" onclick="disconnectBLE()">Disconnect</button>
        </div>

        <!-- Natural Behaviour 运行界面 -->
        <div class="nbm-active-panel" id="nbmPanel">
            <div class="status-text" id="wanderingText">Your pet is wandering...</div>
            <button class="mode-btn" id="toggleBtn" onclick="toggleWander()">🛑 Stop Wandering</button>
            <button class="mode-btn back-btn" onclick="backToPetMenu()">Back to Pet Menu</button>
            <button class="mode-btn disconnect-btn" onclick="disconnectBLE()">Disconnect</button>
        </div>

        <!-- 宠物设置页面 -->
        <div class="setup-panel" id="setupPanel">
            <div class="setup-title">Pet Profile</div>
            <div class="input-group">
                <label>Pet Name</label>
                <input type="text" id="petName" placeholder="e.g. Lucky, Momo">
            </div>
            <div class="input-group">
                <label>Pet Type</label>
                <select id="petType">
                    <option>Dog</option>
                    <option>Cat</option>
                    <option>Pig</option>
                    <option>Rabbit</option>
                    <option>Bear</option>
                </select>
            </div>
            <button class="save-btn" onclick="savePetProfile()">Save & Continue</button>
        </div>
    </div>

<script>
    let characteristic = null;
    let device = null;
    let petName = "My Pet";
    let petType = "Friend";
    let isWandering = false;
    let currentDirection = "";

    // 方向名称映射
    const directionMap = {
        'F': 'Forward',
        'B': 'Backward',
        'L': 'Left',
        'R': 'Right',
        'C': 'Clockwise',
        'A': 'Anti-clockwise',
        'S': 'Stopped'
    };

    // 本地存储读取
    function loadProfile() {
        let n = localStorage.getItem("petName");
        let t = localStorage.getItem("petType");
        if(n) petName = n;
        if(t) petType = t;
        document.getElementById("petName").value = petName;
        document.getElementById("petType").value = petType;
    }

    // 保存宠物资料
    function savePetProfile() {
        petName = document.getElementById("petName").value || "Buddy";
        petType = document.getElementById("petType").value;
        localStorage.setItem("petName", petName);
        localStorage.setItem("petType", petType);
        
        closeAllPanels();
        document.getElementById("modeSelect").style.display = "block";
    }

    // 显示设置
    function showSetup() {
        closeAllPanels();
        document.getElementById("setupPanel").style.display = "block";
    }

    // 关闭所有面板
    function closeAllPanels() {
        document.getElementById("modeSelect").style.display = "none";
        document.getElementById("controls").style.display = "none";
        document.getElementById("petMainPanel").style.display = "none";
        document.getElementById("nbmPanel").style.display = "none";
        document.getElementById("setupPanel").style.display = "none";
    }

    // 更新控制信息显示
    function updateControlInfo(direction) {
        currentDirection = direction;
        const infoDiv = document.getElementById("controlInfo");
        if (direction === 'S') {
            infoDiv.innerHTML = `🐾 ${petName} the ${petType} is now <strong>STOPPED</strong>`;
        } else if (directionMap[direction]) {
            infoDiv.innerHTML = `🚗 ${petName} the ${petType} is now moving <strong>${directionMap[direction]}</strong>`;
        }
    }

    // BLE 连接
    async function startBLE() {
        try {
            device = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'CAR_CONTROL' }],
                optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
            });
            
            device.addEventListener('gattserverdisconnected', onDisconnected);
            
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
            characteristic = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');

            characteristic.startNotifications();
            characteristic.addEventListener('characteristicvaluechanged', (e) => {
                let val = new TextDecoder().decode(e.target.value);
                if(val.startsWith('R')){
                    if(document.getElementById('rssiDisplay')) {
                        document.getElementById('rssiDisplay').innerText = val.substring(1);
                    }
                }
            });

            // 更新UI - 连接成功
            document.getElementById('status').innerText = 'Connected';
            document.getElementById('status').style.color = '#007aff';
            document.getElementById('connectBtn').style.display = 'none';
            document.getElementById('settingsBtn').style.display = 'flex';
            
            loadProfile();
            showSetup(); // 连接成功 → 自动弹出设置
        } catch (e) {
            alert('Connection failed: ' + e.message);
        }
    }

    // 断开连接
    async function disconnectBLE() {
        if (device && device.gatt.connected) {
            device.gatt.disconnect();
        }
        onDisconnected();
    }

    // 断开连接回调
    function onDisconnected() {
        characteristic = null;
        device = null;
        isWandering = false;
        
        // 更新UI - 断开连接
        document.getElementById('status').innerText = 'Disconnected';
        document.getElementById('status').style.color = '#ff3b30';
        document.getElementById('connectBtn').style.display = 'block';
        document.getElementById('settingsBtn').style.display = 'none';
        
        closeAllPanels();
    }

    // 发送指令
    function sendCmd(cmd) {
        if(!characteristic) return;
        characteristic.writeValue(new TextEncoder().encode(cmd)).catch(err => {});
        
        // 更新控制界面显示
        if (document.getElementById('controls').style.display === 'block') {
            updateControlInfo(cmd);
        }
    }

    // 进入手动模式
    function enterController() {
        closeAllPanels();
        document.getElementById('controls').style.display = 'block';
        updateControlInfo('S');
        sendCmd('S');
    }

    // 进入 Pet 主菜单
    function enterPetMain() {
        closeAllPanels();
        document.getElementById('petMainPanel').style.display = 'block';
        sendCmd('S');
    }

    // 启动仿生模式
    function startNBM() {
        closeAllPanels();
        document.getElementById('nbmPanel').style.display = 'block';
        
        isWandering = true;
        document.getElementById("toggleBtn").textContent = "🛑 Stop Wandering";
        document.getElementById('wanderingText').innerHTML = 
            `🌿 ${petName} the ${petType} is currently <strong>wandering around</strong>...`;
        
        sendCmd('M');
    }

    // 切换漫游：停止 / 继续
    function toggleWander() {
        const btn = document.getElementById("toggleBtn");
        const txt = document.getElementById("wanderingText");

        if (isWandering) {
            // 停止
            sendCmd('S');
            btn.textContent = "▶️ Resume Wandering";
            txt.innerHTML = `🛑 ${petName} the ${petType} has <strong>stopped wandering</strong>`;
            isWandering = false;
        } else {
            // 继续漫游
            sendCmd('M');
            btn.textContent = "🛑 Stop Wandering";
            txt.innerHTML = `🌿 ${petName} the ${petType} is currently <strong>wandering around</strong>...`;
            isWandering = true;
        }
    }

    // 回到Pet菜单
    function backToPetMenu() {
        sendCmd('S');
        isWandering = false;
        closeAllPanels();
        document.getElementById('petMainPanel').style.display = 'block';
    }

    // 信号追踪模式
    function startSpotting() {
        alert("👁 Spotting Mode - Follow the strongest signal!\n" + 
               `${petName} the ${petType} is tracking you!`);
        sendCmd('T');  // 发送追踪命令给STM32
        closeAllPanels();
        document.getElementById('petMainPanel').style.display = 'block';
    }

    // 返回主菜单
    function exitToMenu() {
        sendCmd('S');
        isWandering = false;
        closeAllPanels();
        document.getElementById("modeSelect").style.display = "block";
    }

    // 按键控制 - 支持触摸和鼠标
    document.querySelectorAll('.control-btn').forEach(btn => {
        // 阻止所有右键菜单和选择事件
        btn.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            return false;
        });
        
        // 阻止 dragstart 事件（防止拖拽图标）
        btn.addEventListener('dragstart', (e) => {
            e.preventDefault();
            return false;
        });
        
        // 阻止 selectstart 事件
        btn.addEventListener('selectstart', (e) => {
            e.preventDefault();
            return false;
        });
        
        btn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            btn.classList.add('pressed');
            sendCmd(btn.dataset.cmd);
        });
        
        btn.addEventListener('pointerup', (e) => {
            e.preventDefault();
            btn.classList.remove('pressed');
            sendCmd('S');
            updateControlInfo('S');
        });
        
        btn.addEventListener('pointerleave', (e) => {
            btn.classList.remove('pressed');
            sendCmd('S');
            updateControlInfo('S');
        });
        
        // 触摸端额外处理
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            btn.classList.add('pressed');
            sendCmd(btn.dataset.cmd);
        });
        
        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            btn.classList.remove('pressed');
            sendCmd('S');
            updateControlInfo('S');
        });
    });
</script>
</body>
</html>
